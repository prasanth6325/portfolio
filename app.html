<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indian Railways Ticket Booking</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #dddddd;
      text-align: left;
      padding: 10px;
    }
    th {
      background-color: #1e3a8a;
      color: white;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #15803d;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #166534;
    }
    .header-logo {
      height: 50px;
      width: auto;
      vertical-align: middle;
      margin-right: 10px;
    }
    /* Output Message Container with Forced Line Breaking */
    #message {
      margin-top: 15px;
      line-height: 1.8;
      font-size: 15px;
      text-align: left;
    }
    .receipt-item {
      display: block;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <div class="card">
      <h2>
        <img src="logo.png" alt="Logo" class="header-logo">
        Indian Railways Ticket Booking
      </h2>
    </div>

    <!-- Available Trains Table -->
    <div class="card">
      <h3>Available Trains</h3>
      <table>
        <thead>
          <tr>
            <th>Train No</th>
            <th>Train Name</th>
            <th>Route</th>
            <th>Available Seats</th>
            <th>Fare</th>
          </tr>
        </thead>
        <tbody id="train-table-body"></tbody>
      </table>
    </div>

    <!-- Booking Form -->
    <div class="card">
      <h3>Book a Ticket</h3>
      <form id="booking-form">
        <div class="form-group">
          <label for="train-select">Select Train:</label>
          <select id="train-select" required></select>
        </div>

        <div class="form-group">
          <label for="passenger-name">Passenger Name:</label>
          <input type="text" id="passenger-name" placeholder="Enter Passenger Name" required>
        </div>

        <div class="form-group">
          <label for="seats-count">Number of Seats:</label>
          <input type="number" id="seats-count" min="1" max="10" value="1" required>
        </div>

        <button type="submit">Book Now</button>
      </form>

      <!-- Step-by-Step Output Container -->
      <div id="message"></div>
    </div>

    <p><a href="index.html">← Back to Portfolio</a></p>

  </div>

  <script>
    const trains = [
      { id: "22436", name: "Vande Bharat Express", route: "New Delhi (NDLS) → Varanasi (BSB)", seats: 45, fare: 1750 },
      { id: "12951", name: "Mumbai Rajdhani", route: "Mumbai Central (MMCT) → New Delhi (NDLS)", seats: 30, fare: 2100 },
      { id: "12002", name: "Bhopal Shatabdi", route: "New Delhi (NDLS) → Rani Kamlapati (RKMP)", seats: 28, fare: 1250 },
      { id: "12626", name: "Kerala Express", route: "New Delhi (NDLS) → Thiruvananthapuram (TVC)", seats: 60, fare: 1450 },
      { id: "12840", name: "Howrah Mail", route: "Chennai Central (MAS) → Howrah (HWH)", seats: 18, fare: 1320 }
    ];

    function renderTrains() {
      const tableBody = document.getElementById('train-table-body');
      const trainSelect = document.getElementById('train-select');

      tableBody.innerHTML = '';
      trainSelect.innerHTML = '';

      trains.forEach(train => {
        tableBody.innerHTML += `<tr>
          <td>${train.id}</td>
          <td>${train.name}</td>
          <td>${train.route}</td>
          <td>${train.seats}</td>
          <td>₹${train.fare}</td>
        </tr>`;

        const option = document.createElement('option');
        option.value = train.id;
        option.textContent = `${train.name} (#${train.id}) - ₹${train.fare}`;
        trainSelect.appendChild(option);
      });
    }

    // Handle Form Submission
    document.getElementById('booking-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const selectedId = document.getElementById('train-select').value;
      const passengerName = document.getElementById('passenger-name').value;
      const seatCount = parseInt(document.getElementById('seats-count').value);
      const messageElement = document.getElementById('message');

      const train = trains.find(t => t.id === selectedId);

      if (train && train.seats >= seatCount) {
        train.seats -= seatCount; // Deduct seats
        renderTrains(); // Refresh table

        const totalCost = train.fare * seatCount;
        const bookingId = Math.floor(100000 + Math.random() * 900000);

        // Explicit block styling to guarantee multi-line receipt view
        messageElement.style.display = 'block';
        messageElement.style.backgroundColor = '#f0fdf4';
        messageElement.style.border = '1px solid #bbf7d0';
        messageElement.style.padding = '15px';
        messageElement.style.borderRadius = '6px';
        messageElement.style.color = '#15803d';

        messageElement.innerHTML = `
          <div style="font-size: 16px; font-weight: bold; margin-bottom: 10px;">🎉 Booking Successful!</div>
          <div class="receipt-item"><strong>Step 1:</strong> Passenger Name: ${passengerName}</div>
          <div class="receipt-item"><strong>Step 2:</strong> Train: ${train.name} (#${train.id})</div>
          <div class="receipt-item"><strong>Step 3:</strong> Seats Booked: ${seatCount}</div>
          <div class="receipt-item"><strong>Step 4:</strong> Total Fare: ₹${totalCost}</div>
          <div class="receipt-item"><strong>Step 5:</strong> Booking ID: ${bookingId}</div>
        `;

        document.getElementById('passenger-name').value = '';
      } else {
        messageElement.style.display = 'block';
        messageElement.style.backgroundColor = '#fef2f2';
        messageElement.style.border = '1px solid #fecaca';
        messageElement.style.color = '#dc2626';
        messageElement.style.padding = '12px';
        messageElement.style.borderRadius = '6px';
        messageElement.innerHTML = '<strong>Error:</strong> Not enough seats available!';
      }
    });

    // Initial render
    renderTrains();
  </script>

</body>
</html>
